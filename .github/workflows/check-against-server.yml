name: check-against-server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni_mcp
      PUBLIC_BASE_URL: http://localhost:8000
      DASHBOARD_BASE_URL: http://localhost:3000
      ODOO_INTERNAL_BASE_URL: http://localhost:8069
      ODOO_INTERNAL_SHARED_SECRET: test-shared-secret
      TOKEN_SIGNING_KEY: ci-signing-key-padded-to-32-bytes!!
    steps:
      - uses: actions/checkout@v7
        with:
          path: skills
      - uses: actions/checkout@v7
        with:
          repository: Omnidim/omnidim-mcp-cloud
          path: server
      - uses: actions/setup-python@v7
        with:
          python-version-file: server/.python-version
      - name: Put these skills where the server reads them
        run: |
          rm -rf server/app/vendor/omnidim-skills
          mkdir -p server/app/vendor/omnidim-skills
          cp -R skills/skills skills/guides server/app/vendor/omnidim-skills/
      - working-directory: server
        run: pip install --upgrade pip && pip install -e ".[dev]"
      - working-directory: server
        run: alembic upgrade head
      - working-directory: server
        run: >-
          pytest
          tests/test_playbook_files.py
          tests/test_agent_playbooks.py
          tests/test_mcp_procedures.py
          tests/test_book_demo_tools.py
          tests/test_read_guide.py
          tests/test_export_npm_playbooks.py

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code@2.1.331 plugin validate .
